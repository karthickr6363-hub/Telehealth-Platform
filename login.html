<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TeleHealth Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/913/913076.png" type="image/x-icon">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-container reveal pop-up">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fas fa-heartbeat"></i> TeleHealth
                </a>
                <h2>Welcome Back</h2>
                <p>Login to your account to continue</p>
            </div>
            <form>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 14px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="auth-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <div class="social-auth">
                <div class="social-auth-title">Continue with</div>
                <div class="social-btns">
                    <a href="#" class="social-btn google" title="Continue with Google">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="social-btn facebook" title="Continue with Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                </div>
            </div>

            <div class="text-center"
                style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <p>Don't have an account? <a href="signup.html" class="auth-link" style="font-weight: 600;">Sign Up</a>
                </p>
            </div>


        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
