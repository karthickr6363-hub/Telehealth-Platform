<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | TeleHealth Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/913/913076.png" type="image/x-icon">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-container reveal pop-up">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fas fa-heartbeat"></i> TeleHealth
                </a>
                <h2>Create Account</h2>
                <p>Join our platform today</p>
            </div>

            <label style="display: block; margin-bottom: 10px; font-weight: 500;">Select Your Role</label>
            <div class="role-selection">
                <div class="role-option active" onclick="selectRole(this, 'patient')">
                    <i class="fas fa-user-injured"></i>
                    <span>Patient</span>
                </div>
                <div class="role-option" onclick="selectRole(this, 'doctor')">
                    <i class="fas fa-user-md"></i>
                    <span>Doctor</span>
                </div>
            </div>

            <form>
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="form-input" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your password"
                        required>
                </div>
                <div style="margin-bottom: 25px; font-size: 14px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" required> I agree to the <a href="#" class="auth-link">Terms
                            & Conditions</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
            </form>

            <div class="social-auth">
                <div class="social-auth-title">Continue with</div>
                <div class="social-btns">
                    <a href="#" class="social-btn google" title="Continue with Google">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="social-btn facebook" title="Continue with Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                </div>
            </div>

            <div class="text-center"
                style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <p>Already have an account? <a href="login.html" class="auth-link" style="font-weight: 600;">Login</a>
                </p>
            </div>


        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function selectRole(element, role) {
            document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>

</html>
