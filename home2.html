<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleHealth | Better Medicine, Better Life</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="hero section"
            style="background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1576091160550-217359f49f4c?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; padding-top: 180px; text-align: center; color: white;">
            <div class="container" style="max-width: 900px;">
                <h1 style="color: white; margin-bottom: 1.5rem;">The Future of <span
                        style="color: var(--primary);">Patient-Centered</span> Care.</h1>
                <p style="font-size: 1.25rem; color: #cbd5e1; margin-bottom: 2.5rem; line-height: 1.8;">
                    Personalized healthcare solutions for individuals and families. Access top-tier medical
                    professionals from anywhere in the world.
                </p>
                <div class="flex justify-center gap-1">
                    <a href="signup.html" class="btn btn-primary">Join Now</a>
                    <a href="services.html" class="btn btn-outline" style="border-color: white; color: white;">Explore
                        Services</a>
                </div>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;">
                    <div class="card" style="text-align: center;">
                        <h4 style="color: var(--primary); font-size: 2rem;">50k+</h4>
                        <p style="color: var(--text-muted);">Registered Patients</p>
                    </div>
                    <div class="card" style="text-align: center;">
                        <h4 style="color: var(--secondary); font-size: 2rem;">1k+</h4>
                        <p style="color: var(--text-muted);">Licensed Doctors</p>
                    </div>
                    <div class="card" style="text-align: center;">
                        <h4 style="color: var(--accent); font-size: 2rem;">99.8%</h4>
                        <p style="color: var(--text-muted);">Customer Satisfaction</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="js/components.js"></script>
</body>

</html>
